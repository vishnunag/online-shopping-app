{% extends 'shop/base.html' %}

{% block content %}
<h2>Your Cart</h2>
<div class="cart-items">
    {% if cart.products.all %}
        <ul>
        {% for product in cart.products.all %}
            <li>{{ product.name }} - ${{ product.price }}</li>
        {% endfor %}
        </ul>
        <p>Total: ${{ cart.total_price }}</p>
    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}
</div>
{% endblock %}
